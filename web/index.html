<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내주식 지표 스크리너</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="wrap">
  <h1>국내주식 지표 스크리너</h1>
  <p class="sub">PER·PBR·ROE·성장률·부채비율·FCF로 코스피·코스닥 종목을 매일 오전·오후에 점수화합니다.</p>
  <div class="bar">
    <label>분석 시점
      <select id="run"></select>
    </label>
    <span id="meta" class="meta"></span>
  </div>
</header>

<main class="wrap">
  <section id="summary" class="stats"></section>

  <div class="table-scroll">
    <table id="table">
      <thead>
        <tr>
          <th>순위</th><th class="left">종목</th><th>현재가</th><th>시가총액</th>
          <th>PER</th><th>PBR</th><th>ROE</th><th>매출성장</th><th>영업이익성장</th>
          <th>부채비율</th><th>FCF수익률</th><th class="left">점수</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <details class="method">
    <summary>점수 계산 방법</summary>
    <div id="method"></div>
  </details>

  <p class="disclaimer">
    이 페이지는 공개된 재무·시세 데이터를 정해진 규칙으로 정렬한 참고 자료이며 투자 권유가 아닙니다.
    재무 수치는 최근 사업보고서(연간) 기준이고, 시세는 분석 시점 기준입니다. 투자 판단과 책임은 본인에게 있습니다.
  </p>
</main>
<script src="app.js"></script>
</body>
</html>
