<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국장</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="국장">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="wrap">
  <h1><img src="favicon.png" alt="" class="logo">국장</h1>
  <p class="sub">과거 데이터로 검증한 기준(가치·모멘텀·저변동)으로 코스피·코스닥 종목을 점수화하고 10종목 보유 목록을 관리합니다. 평일 오전·오후 자동 분석.</p>
  <div class="bar">
    <label>분석 시점
      <select id="run"></select>
    </label>
    <span id="meta" class="meta"></span>
    <a id="apk" class="apk" href="josangwon-stock.apk" download>안드로이드 앱(APK) 받기</a>
  </div>
</header>

<main class="wrap">
  <section id="regime" class="regime"></section>

  <h2>보유 목록 (매수 관심)</h2>
  <p class="hint" id="portfolio-hint"></p>
  <section id="portfolio"></section>

  <h2>종합 순위</h2>
  <div class="tabs" role="tablist">
    <button type="button" data-view="summary" class="on">요약</button>
    <button type="button" data-view="fund">재무(참고)</button>
    <button type="button" data-view="tech">가격·수급</button>
    <label class="sort">정렬
      <select id="sort">
        <option value="score">종합 점수순</option>
        <option value="buy">매수 관심 우선</option>
      </select>
    </label>
  </div>
  <div class="table-scroll">
    <table id="table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <section id="summary" class="stats"></section>

  <details class="method">
    <summary>점수 계산·매매 규칙</summary>
    <div id="method"></div>
  </details>

  <h2>검증 결과 (백테스트)</h2>
  <section id="backtest" class="card pad"></section>

  <p class="disclaimer">
    이 페이지는 공개된 재무·시세 데이터를 정해진 규칙으로 정렬한 참고 자료이며 투자 권유가 아닙니다.
    재무 수치는 최근 사업보고서(연간) 기준이고, 시세는 분석 시점 기준입니다. 신용잔고·공매도 데이터는 반영하지 않았습니다.
    투자 판단과 책임은 본인에게 있습니다.
  </p>
</main>
<script src="app.js"></script>
</body>
</html>
