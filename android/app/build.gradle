plugins {
    id "com.android.application"
}

android {
    namespace "com.josangwon.stock"
    compileSdk 34

    defaultConfig {
        applicationId "com.josangwon.stock"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "2.4"
        // 앱이 여는 웹앱 주소 (GitHub Pages)
        buildConfigField "String", "APP_URL", "\"https://akskekekdk.github.io/lockedscreenmemoapp/\""
    }

    buildFeatures {
        buildConfig true
    }

    // 저장소에 함께 둔 키로 서명한다. 어느 컴퓨터에서 빌드해도 서명이 같아야
    // 이미 설치된 앱 위에 업데이트로 설치된다(키가 바뀌면 지우고 다시 설치해야 함).
    signingConfigs {
        shared {
            storeFile rootProject.file("keystore/release.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
